name: RASFF probe 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RASFF list and detail samples
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          BASE = "https://webgate.ec.europa.eu/rasff-window/backend/public/notification/"
          HDR = {"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "FoodOK/1.0 (+https://foodok.org)"}

          def post(url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=HDR, method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def iso(s):
              s = str(s or "")
              return s[6:10] + "-" + s[3:5] + "-" + s[0:2] if len(s) >= 10 else ""

          rows = []
          note = {}
          try:
              for p in range(1, 90):
                  d = None
                  for attempt in range(3):
                      try:
                          d = post(BASE + "search/consolidated/", {"parameters": {"pageNumber": p, "itemsPerPage": 100}})
                          break
                      except Exception as e:
                          time.sleep(2)
                  if d is None:
                      note["stopped_at_page"] = p
                      break
                  lst = d.get("notifications") or []
                  for n in lst:
                      rows.append({
                          "id": n.get("notifId"),
                          "d": iso(n.get("ecValidationDate")),
                          "ref": n.get("reference"),
                          "s": n.get("subject"),
                          "cat": (n.get("productCategory") or {}).get("description"),
                          "cls": (n.get("notificationClassification") or {}).get("description"),
                          "risk": (n.get("riskDecision") or {}).get("description"),
                          "n": (n.get("notifyingCountry") or {}).get("organizationName"),
                          "o": [x.get("organizationName") for x in (n.get("originCountries") or [])],
                      })
                  if not lst or min(x["d"] for x in rows[-len(lst):] if x["d"]) < "2025-10-25":
                      break
                  time.sleep(0.3)
          except Exception as e:
              note["list_error"] = repr(e)
          note["rows"] = len(rows)

          detail = {"tried": []}
          ids = [r["id"] for r in rows[:3] if r.get("id")]
          for i in ids[:1]:
              for url in [BASE + "view/id/" + str(i), BASE + str(i), BASE + "id/" + str(i)]:
                  rec = {"url": url}
                  try:
                      req = urllib.request.Request(url, headers=HDR, method="GET")
                      with urllib.request.urlopen(req, timeout=60) as r:
                          body = r.read().decode()
                      rec["status"] = 200
                      try:
                          j = json.loads(body)
                          rec["keys"] = list(j.keys()) if isinstance(j, dict) else str(type(j))
                          rec["full"] = j
                      except Exception:
                          rec["text"] = body[:1500]
                  except urllib.error.HTTPError as e:
                      rec["status"] = e.code
                  except Exception as e:
                      rec["error"] = repr(e)
                  detail["tried"].append(rec)
                  time.sleep(0.3)

          os.makedirs("data", exist_ok=True)
          with open("data/rasff_list_12m.json", "w", encoding="utf-8") as fh:
              json.dump({"note": note, "rows": rows}, fh, ensure_ascii=False)
          with open("data/rasff_detail_probe.json", "w", encoding="utf-8") as fh:
              json.dump(detail, fh, ensure_ascii=False, indent=2)
          PY

      - name: Commit samples
        run: |
          git config user.name "foodok-bot"
          git config user.email "bot@foodok.org"
          git add data/rasff_list_12m.json data/rasff_detail_probe.json
          git commit -m "Add RASFF list and detail samples"
          git push
