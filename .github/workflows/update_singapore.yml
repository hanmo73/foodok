name: Update Singapore data
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Singapore data
        run: |
          RC=0
          python3 scripts/update_singapore.py > out.txt 2>&1 || RC=$?
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add singapore.json
          git diff --cached --quiet || (git commit -m "Update Singapore data" && git push)
