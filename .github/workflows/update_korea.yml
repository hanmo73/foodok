name: Update Korea data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry (check only) or live (save)"
        default: "dry"
  schedule:
    - cron: "45 2 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Korea data
        run: |
          RC=0
          python3 scripts/update_korea.py "${{ github.event.inputs.mode || 'live' }}" > out.txt 2>&1 || RC=$?
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add korea.json
          git diff --cached --quiet || (git commit -m "Update Korea data" && git push)
