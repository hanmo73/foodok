name: Korea probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch page
        run: |
          curl -sS -L -m 60 -A "Mozilla/5.0" -o page.html https://impfood.mfds.go.kr/CFCEE01F01 || echo "FAILED"
          {
            echo '```'
            echo "items on page: $(grep -ac 'fnShowVioltCtnt' page.html)"
            echo "---- input/select names"
            grep -aoE '<(input|select)[^>]*name="[^"]*"[^>]*>' page.html | cut -c1-160 | head -30
            echo "---- fnPageLimit"
            grep -a -B2 -A8 'fnPageLimit' page.html | cut -c1-160 | head -40
            echo "---- paging links"
            grep -aoE '(href|onclick)="[^"]*(page|Page)[^"]*"' page.html | cut -c1-160 | sort -u | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
