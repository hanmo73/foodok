name: Asia probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find Thailand data source
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, urllib.request
          fence = chr(96) * 3
          print(fence)
          H = {'User-Agent': 'Mozilla/5.0', 'Accept': 'text/html,application/json,*/*'}
          def get(u):
              req = urllib.request.Request(u, headers=H)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.status, r.read().decode('utf-8', 'ignore')
          base = 'https://www.acfs.go.th'
          code, t = get(base + '/news/early-warning')
          print('page', code, len(t))
          for k in sorted(set(re.findall(r'/?api/[A-Za-z0-9_/.?=&%-]{3,80}', t)))[:15]:
              print('api:', k)
          for k in sorted(set(re.findall(r'[A-Za-z0-9_/.-]*(?:_payload|__NUXT__|__NEXT_DATA__)[A-Za-z0-9_/.-]*', t)))[:5]:
              print('data:', k)
          for p in ['/api/articles?language=th', '/api/news?language=th', '/news/early-warning/_payload.json']:
              try:
                  c, b = get(base + p)
                  print(p, c, len(b), re.sub(r'\s+', ' ', b[:200]))
              except Exception as e:
                  print(p, 'FAIL', str(e)[:60])
          print(fence)
          PY
