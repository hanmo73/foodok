name: Asia probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Thailand early warning
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, html, urllib.request
          fence = chr(96) * 3
          print(fence)
          u = 'https://www.acfs.go.th/news/early-warning'
          try:
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'text/html,*/*'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  t = r.read().decode('utf-8', 'ignore')
                  print(u, r.status, 'size', len(t))
              n = 0
              for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', t, re.S | re.I):
                  txt = re.sub(r'<[^>]+>', '', m.group(2))
                  txt = html.unescape(re.sub(r'\s+', ' ', txt)).strip()
                  if txt and len(txt) > 15 and '/news/' in m.group(1):
                      print('  ', txt[:70], '|', m.group(1)[:70])
                      n += 1
                      if n >= 15:
                          break
              for k in re.findall(r'(?:rss|feed|api)[^"\' <]{0,60}', t, re.I)[:5]:
                  print('  hint:', k)
          except Exception as e:
              print(u, 'FAIL', str(e)[:80])
          print(fence)
          PY
