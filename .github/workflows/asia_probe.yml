name: Asia probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Taiwan feed
        run: |
          export PYTHONIOENCODING=utf-8
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, urllib.request, html
          print('```')
          try:
              req = urllib.request.Request('https://www.fda.gov.tw/ENG/rssNews.ashx', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  t = r.read().decode('utf-8', 'ignore')
              print('size', len(t))
              items = re.findall(r'<item>(.*?)</item>', t, re.S)
              print('items', len(items))
              for it in items[:15]:
                  ti = re.search(r'<title>(.*?)</title>', it, re.S)
                  da = re.search(r'<pubDate>(.*?)</pubDate>', it, re.S)
                  print((da.group(1) if da else '')[:16], '|', html.unescape(re.sub(r'<!\[CDATA\[|\]\]>', '', ti.group(1)))[:90] if ti else '')
          except Exception as e:
              print('FAIL', e)
          print('```')
          PY
