name: Asia probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find Thailand API base
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, json, urllib.request
          fence = chr(96) * 3
          print(fence)
          H = {'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json,text/html,*/*'}
          def get(u):
              req = urllib.request.Request(u, headers=H)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.status, r.read().decode('utf-8', 'ignore')
          base = 'https://www.acfs.go.th'
          c, t = get(base + '/news/early-warning')
          for m in list(re.finditer(r'content-daily-warning', t))[:2]:
              print('ctx:', re.sub(r'\s+', ' ', t[max(0, m.start()-120):m.end()+60]))
          for m in list(re.finditer(r'(?:apiBase|baseURL|API_URL|apiUrl|publicApi)[^,;]{0,80}', t, re.I))[:4]:
              print('cfg:', m.group(0)[:110])
          for p in ['/api/v1.0/publish/content-daily-warning?limit=3',
                    '/v1.0/publish/content-daily-warning?limit=3',
                    '/api/publish/content-daily-warning?limit=3']:
              for b in [base, 'https://api.acfs.go.th', 'https://www.acfs.go.th/backend']:
                  try:
                      c2, b2 = get(b + p)
                      print('OK', b + p, c2, len(b2), re.sub(r'\s+', ' ', b2[:120]))
                  except Exception as e:
                      print('no', b + p, str(e)[:30])
          try:
              c3, b3 = get(base + '/api/news?language=th')
              j = json.loads(b3)
              for it in j['data'][:3]:
                  print('news:', it.get('id'), it.get('category_id'), list(it.keys())[:8])
          except Exception as e:
              print('news FAIL', str(e)[:60])
          print(fence)
          PY
