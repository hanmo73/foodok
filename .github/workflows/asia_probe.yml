name: Asia probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at Thailand warnings
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, urllib.request
          fence = chr(96) * 3
          print(fence)
          u = 'https://www.acfs.go.th/api/v1.0/publish/content-daily-warning?page=1&limit=3'
          try:
              req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  j = json.loads(r.read().decode('utf-8', 'ignore'))
              print('top keys:', list(j.keys()))
              d = j.get('data', j)
              if isinstance(d, dict):
                  print('data keys:', list(d.keys()))
                  for k, v in d.items():
                      if isinstance(v, list):
                          d = v
                          break
              for it in (d[:3] if isinstance(d, list) else []):
                  print('---')
                  for k, v in it.items():
                      print(k, '=', str(v)[:90].replace('\n', ' '))
          except Exception as e:
              print('FAIL', str(e)[:100])
          print(fence)
          PY
