name: FoodOK Global Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: pip install requests beautifulsoup4

      - name: Run Global Collector
        run: python scripts/collect_all.py

      - name: Save to site
        run: |
          git config --global user.name 'FoodOK Bot'
          git config --global user.email 'bot@foodok.org'
          git add .
          git commit -m "Nightly global food safety auto-update [skip ci]" || exit 0
          git push
