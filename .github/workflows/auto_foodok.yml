name: FoodOK Global Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: pip install requests beautifulsoup4

      - name: Run Global Collector
        run: python scripts/collect_all.py

      - name: Save to site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Nightly global food safety auto-update [skip ci]"
          branch: main
          file_pattern: data/latest.json
